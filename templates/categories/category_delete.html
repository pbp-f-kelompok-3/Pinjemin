{% extends 'base.html' %}

{% block title %}Hapus Kategori{% endblock %}

{% block content %}
    <p>
        Apakah yakin ingin menghapus
        <strong>{{ category.name }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>

    <a href="{% url 'categories:show_categories' %}">Cancel</a>
{% endblock %}
