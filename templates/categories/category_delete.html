{% extends 'base.html' %}

{% load static %}

{% block title %}Hapus Kategori{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/categories.css' %}">
{% endblock %}


{% block content %}
<section class="category-page category-page--narrow" aria-labelledby="category-delete-title">

    <header class="category-page__header">
        <div class="category-page__intro">
            <h1 id="category-delete-title" class="category-page__title">Hapus Kategori</h1>
        </div>
    </header>

    <div class="category-panel">
        <p class="category-panel__text">
            Apakah yakin ingin menghapus
            <strong>{{ category.name }}</strong>?
        </p>

        <form method="post" class="category-panel__actions">
            {% csrf_token %}
            <button type="submit" class="category-btn category-btn--danger-solid">
                Ya, Hapus Kategori
            </button>
            <a href="{% url 'categories:show_categories' %}"
               class="category-btn category-btn--ghost">
                Batal
            </a>
        </form>
    </div>

</section>
{% endblock %}
