{% load static %}
<header>
  <div class="container navbar">

    <a class="brand" href="{% url 'home' %}">
      <img src="{% static 'img/Logo_v2.png' %}" alt="Pinjemin" class="brand-logo">
    </a>

    <nav aria-label="Navigasi utama">
      <form class="search-form" method="GET" action="{% url 'home' %}"> 
        <input type="search" placeholder="Cari di Pinjemin..."> 
        <button type="submit">Cari</button> 
      </form>

      <a href="{% url 'home' %}">Beranda</a>

      <a href="#">
        Cari Barang
      </a>

      <a href="#">
        Kategori
      </a>

      <a href="#">
        Lokasi
      </a>

      {% if user.is_authenticated %}
        <a href="{% url 'barang:dashboard' %}">
          Barang Saya
        </a>
        <a href="{% url 'accounts:profile' %}">
          Akun Saya
        </a>
        <a href="{% url 'barang:tambah' %}">
          Jual / Sewa
        </a>
      {% else %}
        <a href="{% url 'accounts:login' %}">
          Login / Daftar
        </a>
        <a href="{% url 'barang:tambah' %}">
          Jual / Sewa
        </a>
      {% endif %}
    </nav>

  </div>
</header>
